<title>主持端｜皮克敏抽直屬</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />

<header class="topbar">
  <h1>🎤 主持端</h1>
  <span class="mode-badge" id="modeBadge">連線模式：讀取中…</span>
</header>

<main>
  <section class="panel round-display">
    <h2 style="justify-content:center;">目前召集任務</h2>
    <div class="round-sentence" id="roundSentence">尚未發布任務</div>
    <div class="round-progress-wrap">
      <div class="round-progress-bar" id="roundProgressBar" style="width:0%"></div>
    </div>
    <div class="round-progress-text" id="roundProgressText">0 / 0 人已上台</div>
    <div class="round-card-list" id="roundCardList"></div>
  </section>

  <section class="panel">
    <h2>📣 出題設定</h2>

    <div class="field-row">
      <label>出題方式</label>
      <div class="mode-toggle">
        <button type="button" id="modeSpecificBtn" class="active">依指定種類＋數量</button>
        <button type="button" id="modeAnyBtn">任選不同種類</button>
      </div>
    </div>

    <div id="specificModePanel">
      <div class="field-row"><label>需要的種類與隻數</label></div>
      <div class="type-count-grid" id="typeCountGrid"></div>
    </div>

    <div id="anyModePanel" style="display:none;">
      <div class="field-row">
        <label>需要幾隻不同種類</label>
        <div class="stepper" data-stepper="anyCount">
          <button type="button" data-delta="-1">－</button>
          <span>3</span>
          <button type="button" data-delta="1">＋</button>
        </div>
      </div>
    </div>

    <div class="field-row">
      <label>力量值條件</label>
      <select id="conditionSelect">
        <option value="none">不限定</option>
        <option value="eq" selected>加總剛好等於</option>
        <option value="gte">加總至少為</option>
        <option value="lte">加總最多為</option>
      </select>
      <input type="number" id="conditionValue" value="10" min="1" max="99" style="width:70px;" />
    </div>

    <div class="field-row">
      <label>本輪名額</label>
      <div class="stepper" data-stepper="maxPeople">
        <button type="button" data-delta="-1">－</button>
        <span>5</span>
        <button type="button" data-delta="1">＋</button>
      </div>
      <span style="color:var(--muted); font-size:0.85rem;">（最多可上台人數，可依人數彈性調整）</span>
    </div>

    <div class="field-row" style="flex-direction:column; align-items:stretch;">
      <label>自動產生的敘述（預覽）</label>
      <div class="sentence-preview" id="sentencePreview">請先設定條件</div>
    </div>

    <div class="field-row" style="flex-direction:column; align-items:stretch;">
      <label>自訂敘述（選填，填了就會取代上面的自動敘述）</label>
      <textarea id="customSentence" placeholder="例如：這一輪找 2 隻紅色皮克敏，力量值加起來要剛好 10 分，找到的同學快上台！"></textarea>
    </div>

    <div class="btn-row">
      <button class="btn" id="publishBtn">🚀 發布本輪任務</button>
      <button class="btn secondary" id="nextRoundBtn">🔁 沿用敘述、開下一輪（重算名額）</button>
    </div>
  </section>

  <section class="panel">
    <h2>🛠️ 紀錄管理</h2>
    <div class="btn-row">
      <button class="btn secondary" id="undoBtn">↩️ 撤銷最後一筆回報</button>
      <button class="btn danger" id="resetAllBtn">⚠️ 清空全部資料（活動前測試用）</button>
    </div>
  </section>

  <section class="panel">
    <h2>📜 歷史紀錄</h2>
    <div class="history-list" id="historyList">
      <p style="color:var(--muted);">尚無紀錄</p>
    </div>
  </section>
</main>

<footer><a href="index.html">← 回首頁</a></footer>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/pikmin-data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sync.js"></script>
<script src="js/host.js"></script>
