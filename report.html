<title>報到回報端｜皮克敏抽直屬</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />

<header class="topbar top-status">
  <h1>📋 報到回報端</h1>
  <span class="mode-badge" id="modeBadge">連線模式：讀取中…</span>
</header>

<main>
  <section class="panel">
    <h2>目前召集任務</h2>
    <div class="round-sentence" id="roundSentence" style="font-size:1.2rem;">尚未發布任務</div>
    <div class="round-progress-text" id="roundProgressText">0 / 0 人已上台</div>
  </section>

  <section class="panel">
    <h2>點選同學的皮克敏卡片來回報</h2>
    <p style="color:var(--muted); font-size:0.9rem;">
      確認新生的身分卡符合目前任務條件後，點下對應「種類＋數字」的按鍵即可回報給主持端，
      按過的卡片會變灰，避免重複回報同一張卡。
    </p>
    <div class="pikmin-grid" id="pikminGrid"></div>
    <div class="btn-row">
      <button class="btn secondary" id="undoBtn">↩️ 撤銷上一筆回報</button>
    </div>
    <div class="legend" id="legend"></div>
  </section>
</main>

<footer><a href="index.html">← 回首頁</a></footer>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/pikmin-data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sync.js"></script>
<script src="js/report.js"></script>
